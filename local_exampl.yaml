# =============================================
# Variator2026 — Local Development Config
# =============================================

server:
  port: 9090
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s

database:
  host: localhost
  port: 5432
  name: variator
  user: postgres
  password: postgres
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 5
  read_timeout: 3s
  write_timeout: 3s

jwt:
  secret: your-secret-key-change-this-in-production
  access_ttl: 15m
  refresh_ttl: 720h  # 30 дней

auth:
  bcrypt_cost: 12
  max_login_attempts: 10
  login_window: 15m

logging:
  level: debug
  format: text  # text | json
