  # ==================== 14. ADMIN: CREATE MARKET ====================
  /api/admin/markets:
    post:
      tags: [Admin]
      operationId: createMarket
      summary: Создать новый рынок (Admin/Moderator)
      description: |
        Создание нового рынка предсказаний.

        **Требования:**
        - Авторизация: JWT (роль admin или moderator)
        - Минимум 2 исхода (outcomes)
        - Deadline в будущем (RFC3339)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, outcomes, deadline]
              properties:
                title:
                  type: string
                  maxLength: 200
                  example: "Кто станет президентом в 2028?"
                description:
                  type: string
                  example: "Рынок на следующие президентские выборы"
                outcomes:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  example: ["Кандидат A", "Кандидат B"]
                deadline:
                  type: string
                  format: date-time
                  example: "2028-11-06T00:00:00Z"
                category:
                  type: string
                  example: "politics"
      responses:
        "201":
          description: Рынок создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "400":
          description: Невалидный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== 13. ADMIN: RESOLVE MARKET ====================
  /api/admin/markets/{marketId}/resolve:
    post:
      tags: [Admin]
      operationId: resolveMarket
      summary: Разрешить исход рынка (Admin/Moderator только)
      description: |
        Закрыть рынок и определить выигрывающий исход
        
        **Требует:** Роль Admin или Moderator
        
        **Действия:** 
        1. Закрывает все открытые ордера
        2. Вычисляет выигрыши для всех участников
        3. Зачисляет средства на счета победителей
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID рынка
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveMarketRequest"
      responses:
        200:
          description: Рынок успешно разрешен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveMarketResponse"
        400:
          description: Неверный исход или параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Только Admin или Moderator могут разрешить
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: FORBIDDEN
                  message: "Только Admin и Moderator могут разрешить события"
        404:
          description: Рынок не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        409:
          description: Рынок не может быть разрешен (уже разрешен)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: CONFLICT
                  message: "Этот рынок уже разрешен"
        500:
          description: Внутренняя ошибка при разрешении
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        503:
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

